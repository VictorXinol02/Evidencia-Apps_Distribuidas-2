<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Tarjeta animada con pop-up</title>
    <style>
      .tarjeta {
        width: 300px;
        height: 400px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        position: relative;
        transition: all 0.3s ease-in-out;
      }
      
      .tarjeta:hover {
        transform: translateY(-10px);
      }
      
      .tarjeta:hover .contenido {
        transform: translateY(100%);
      }
      
      .tarjeta:hover .contenido:before {
        transform: scale(1);
        opacity: 1;
      }
      
      .contenido {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 20px;
        background-color: #f0f0f0;
        transition: all 0.3s ease-in-out;
        transform: translateY(0);
      }
      
      .contenido h2 {
        margin-top: 0;
      }
      
      .contenido:before {
        content: "";
        position: absolute;
        top: -50px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transition: all 0.3s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <img src="https://picsum.photos/300/200" alt="Imagen de la tarjeta">
      <div class="contenido">
        <h2>Título de la tarjeta</h2>
        <p>Contenido de la tarjeta. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed at tristique mauris, ut sodales mauris. Integer interdum leo eu sapien luctus, non malesuada est facilisis.</p>
      </div>
    </div>
  </body>
</html>
